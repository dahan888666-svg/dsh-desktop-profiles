<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: Canvas;
        color: CanvasText;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .box { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 2.5px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-top-color: color-mix(in srgb, CanvasText 78%, transparent);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .title { font-size: 15px; font-weight: 600; letter-spacing: .2px; }
      .hint { font-size: 12px; color: color-mix(in srgb, CanvasText 55%, transparent); }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <div class="title" id="title">正在切换 Profile…</div>
      <div class="hint" id="hint">其它 Profile 的任务会在后台继续运行</div>
    </div>
    <script>
      try {
        const params = new URLSearchParams(location.search)
        const name = params.get('name')
        const zh = (params.get('lang') || 'en').startsWith('zh')
        if (name) document.getElementById('title').textContent = zh ? `正在切换到「${name}」…` : `Switching to "${name}"…`
        document.getElementById('hint').textContent = zh ? '其它 Profile 的任务会在后台继续运行' : 'Tasks in other profiles keep running in the background'
        document.documentElement.lang = zh ? 'zh' : 'en'
      } catch {}
    </script>
  </body>
</html>
